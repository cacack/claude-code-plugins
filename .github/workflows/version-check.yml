name: Plugin Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin structure
        run: claude plugin validate ./plugins/cacack

      - name: Test plugin installation
        run: |
          # Use isolated home directory for clean test
          export HOME=$(mktemp -d)

          # Add local marketplace and install
          claude plugin marketplace add ./
          claude plugin install cacack@cacack

          # Verify installation
          if [ -d "$HOME/.claude/plugins/cache/cacack/cacack" ]; then
            echo "✓ Plugin installed successfully"
            ls -la "$HOME/.claude/plugins/cache/cacack/cacack/"
          else
            echo "✗ Plugin installation failed"
            exit 1
          fi

  check-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if resources changed
        id: resources
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)

          if echo "$CHANGED" | grep -qE '^plugins/cacack/(commands/|agents/|skills/|hooks/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Resource files changed:"
            echo "$CHANGED" | grep -E '^plugins/cacack/(commands/|agents/|skills/|hooks/)' || true
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No resource file changes detected"
          fi

      - name: Check version bump
        if: steps.resources.outputs.changed == 'true'
        run: |
          PR_MARKETPLACE=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          PR_PLUGIN=$(jq -r '.version' plugins/cacack/.claude-plugin/plugin.json)

          git show origin/main:.claude-plugin/marketplace.json > /tmp/main-marketplace.json
          git show origin/main:plugins/cacack/.claude-plugin/plugin.json > /tmp/main-plugin.json

          MAIN_MARKETPLACE=$(jq -r '.plugins[0].version' /tmp/main-marketplace.json)
          MAIN_PLUGIN=$(jq -r '.version' /tmp/main-plugin.json)

          echo "Main: marketplace=$MAIN_MARKETPLACE, plugin=$MAIN_PLUGIN"
          echo "PR:   marketplace=$PR_MARKETPLACE, plugin=$PR_PLUGIN"

          if [ "$PR_MARKETPLACE" != "$PR_PLUGIN" ]; then
            echo "::error::Version mismatch between marketplace.json and plugin.json"
            exit 1
          fi

          if [ "$PR_MARKETPLACE" = "$MAIN_MARKETPLACE" ]; then
            echo "::error::Resource files changed but version was not bumped!"
            exit 1
          fi

          echo "Version bumped from $MAIN_MARKETPLACE to $PR_MARKETPLACE"

      - name: Skip version check
        if: steps.resources.outputs.changed == 'false'
        run: echo "No resource changes - version bump not required"
