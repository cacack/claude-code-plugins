name: Plugin Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin structures
        run: |
          for dir in plugins/*/; do
            echo "::group::Validating $dir"
            claude plugin validate "$dir"
            echo "::endgroup::"
          done

      - name: Test plugin installation
        run: |
          # Use isolated home directory for clean test
          export HOME=$(mktemp -d)

          claude plugin marketplace add ./

          for dir in plugins/*/; do
            name=$(basename "$dir")
            claude plugin install "$name@cacack"

            if [ -d "$HOME/.claude/plugins/cache/cacack/$name" ]; then
              echo "✓ $name installed successfully"
            else
              echo "✗ $name installation failed"
              exit 1
            fi
          done

  check-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check per-plugin version bumps
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          FAILED=0

          for dir in plugins/*/; do
            name=$(basename "$dir")

            if ! echo "$CHANGED" | grep -q "^plugins/$name/"; then
              echo "$name: no changes — version bump not required"
              continue
            fi

            PR_PLUGIN=$(jq -r '.version' "plugins/$name/.claude-plugin/plugin.json")
            PR_MARKETPLACE=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .version' .claude-plugin/marketplace.json)

            if [ "$PR_MARKETPLACE" != "$PR_PLUGIN" ]; then
              echo "::error::$name: version mismatch between marketplace.json ($PR_MARKETPLACE) and plugin.json ($PR_PLUGIN)"
              FAILED=1
              continue
            fi

            if MAIN_PLUGIN_JSON=$(git show "origin/main:plugins/$name/.claude-plugin/plugin.json" 2>/dev/null); then
              MAIN_VERSION=$(echo "$MAIN_PLUGIN_JSON" | jq -r '.version')
              if [ "$PR_PLUGIN" = "$MAIN_VERSION" ]; then
                echo "::error::$name: files changed but version ($PR_PLUGIN) was not bumped"
                FAILED=1
              else
                echo "$name: version bumped from $MAIN_VERSION to $PR_PLUGIN"
              fi
            else
              echo "$name: new plugin at $PR_PLUGIN — no bump required"
            fi
          done

          exit $FAILED
