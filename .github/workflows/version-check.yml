name: Version Check

on:
  pull_request:
    branches: [main]

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if resources changed
        id: resources
        run: |
          # Get list of changed files compared to main
          CHANGED=$(git diff --name-only origin/main...HEAD)

          # Check if any resource directories have changes
          if echo "$CHANGED" | grep -qE '^(commands/|agents/|skills/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Resource files changed:"
            echo "$CHANGED" | grep -E '^(commands/|agents/|skills/)' || true
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No resource file changes detected"
          fi

      - name: Check version bump
        if: steps.resources.outputs.changed == 'true'
        run: |
          # Get versions from PR branch
          PR_MARKETPLACE_META=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          PR_MARKETPLACE_PLUGIN=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          PR_PLUGIN=$(jq -r '.version' .claude-plugin/plugin.json)

          # Get versions from main branch
          git show origin/main:.claude-plugin/marketplace.json > /tmp/main-marketplace.json
          git show origin/main:.claude-plugin/plugin.json > /tmp/main-plugin.json

          MAIN_MARKETPLACE_META=$(jq -r '.metadata.version' /tmp/main-marketplace.json)
          MAIN_MARKETPLACE_PLUGIN=$(jq -r '.plugins[0].version' /tmp/main-marketplace.json)
          MAIN_PLUGIN=$(jq -r '.version' /tmp/main-plugin.json)

          echo "Main branch versions:"
          echo "  marketplace.json metadata.version: $MAIN_MARKETPLACE_META"
          echo "  marketplace.json plugins[0].version: $MAIN_MARKETPLACE_PLUGIN"
          echo "  plugin.json version: $MAIN_PLUGIN"
          echo ""
          echo "PR branch versions:"
          echo "  marketplace.json metadata.version: $PR_MARKETPLACE_META"
          echo "  marketplace.json plugins[0].version: $PR_MARKETPLACE_PLUGIN"
          echo "  plugin.json version: $PR_PLUGIN"

          # Check if versions are in sync
          if [ "$PR_MARKETPLACE_META" != "$PR_MARKETPLACE_PLUGIN" ] || [ "$PR_MARKETPLACE_META" != "$PR_PLUGIN" ]; then
            echo ""
            echo "::error::Version mismatch! All three version fields must be identical."
            exit 1
          fi

          # Check if version was bumped
          if [ "$PR_MARKETPLACE_META" = "$MAIN_MARKETPLACE_META" ]; then
            echo ""
            echo "::error::Resource files changed but version was not bumped!"
            echo "::error::Current version: $MAIN_MARKETPLACE_META"
            echo "::error::Please bump the version in:"
            echo "::error::  - .claude-plugin/marketplace.json (metadata.version)"
            echo "::error::  - .claude-plugin/marketplace.json (plugins[0].version)"
            echo "::error::  - .claude-plugin/plugin.json (version)"
            exit 1
          fi

          echo ""
          echo "Version bumped from $MAIN_MARKETPLACE_META to $PR_MARKETPLACE_META"

      - name: Skip version check
        if: steps.resources.outputs.changed == 'false'
        run: echo "No resource changes - version bump not required"
